# Producer config: connects to the LEAF node
# Messages flow: producer -> leaf -> hub -> consumer

nats.url=nats://localhost:4223
service.name=example-producer
traces.subject=telemetry.traces

# Per-message server tracing — Nats-Trace-Dest header is forwarded by the leaf
# to the hub via Nats-Trace-Hop, causing BOTH servers to emit MsgTraceEvent JSON.
server.trace.dest=telemetry.server.traces

# Set to false to disable all tracing (no headers injected, no spans, no NATS telemetry traffic)
tracing.enabled=true

# Example application tracing configuration

nats.url=nats://localhost:4222
service.name=example-producer
traces.subject=telemetry.traces

# Per-message server tracing (ADR-41): NATS Server 2.11+ will emit MsgTraceEvent JSON
# to this subject for every message published by this app.
# The exporter-service picks these up and converts them to OTel server-hop spans.
server.trace.dest=telemetry.server.traces

# Synadia NATS OTel Exporter Service - configuration

# NATS server URL
nats.url=nats://localhost:4222

# Subject where client-lib publishes span JSON (must match traces.subject in client tracing.properties)
client.traces.subject=telemetry.traces

# Subject where NATS Server 2.11+ publishes MsgTraceEvent JSON (ADR-41).
# Must match msg_trace.dest in the NATS server account configuration:
#   accounts {
#     APP {
#       msg_trace: {
#         dest: "telemetry.server.traces"
#         sampling: 100%
#       }
#     }
#   }
server.traces.subject=telemetry.server.traces

# OTLP/gRPC endpoint for Jaeger (or any OTel Collector).
# Jaeger 1.35+ accepts OTLP natively on port 4317.
jaeger.endpoint=http://localhost:4317

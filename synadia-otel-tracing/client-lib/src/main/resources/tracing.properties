# Synadia NATS OTel Client Library - default configuration
# Override values in your application's config file.

# NATS server URL
nats.url=nats://localhost:4222

# OTel service name shown in Jaeger
service.name=nats-app

# NATS subject where client spans are published (consumed by exporter-service)
traces.subject=telemetry.traces

# Optional: inject Nats-Trace-Dest header per message to trigger NATS server tracing.
# Leave blank to rely on account-level msg_trace.dest config in the NATS server instead.
# See: https://github.com/nats-io/nats-architecture-and-design/blob/main/adr/ADR-41.md
server.trace.dest=

# Master on/off switch for tracing. Set to false to disable all tracing:
# no spans created, no traceparent or Nats-Trace-Dest headers injected, zero telemetry traffic.
tracing.enabled=true

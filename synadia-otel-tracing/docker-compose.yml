services:

  nats-hub:
    image: nats:latest
    ports:
      - "4222:4222"   # client connections
      - "7422:7422"   # leaf node connections
      - "8222:8222"   # monitoring
    volumes:
      - ./nats/hub.conf:/etc/nats/hub.conf
    command: ["-c", "/etc/nats/hub.conf"]

  nats-leaf:
    image: nats:latest
    ports:
      - "4223:4223"   # client connections (producer connects here)
      - "8223:8223"   # monitoring
    volumes:
      - ./nats/leaf.conf:/etc/nats/leaf.conf
    command: ["-c", "/etc/nats/leaf.conf"]
    depends_on:
      - nats-hub

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP/gRPC  ← exporter-service sends here
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
